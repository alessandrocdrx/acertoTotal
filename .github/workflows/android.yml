name: Android

on:
  push:
    branches: ['**']   # tags (v1.0.1...) marcam commits já testados: não rodam de novo
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Instalar Playwright e Chromium
        run: |
          npm install -g playwright
          playwright install --with-deps chromium
      - name: Testes do protótipo (Playwright)
        run: bash testes/rodar.sh
      - name: Testes de unidade do app nativo
        run: |
          cd android
          ./gradlew --no-daemon testHomologDebugUnitTest
      # Só confere que o APK de teste compila. Ele não é publicado em lugar nenhum: o repositório é público,
      # e o APK de teste tem a assinatura simulada, que liberaria o app de graça para quem baixasse.
      - name: Compilar o APK de teste (só conferência)
        run: |
          cd android
          ./gradlew --no-daemon assembleHomologRelease

  # Lançamento na Play Store: commit na main com "[release]" na mensagem.
  # Precisa dos Secrets ACERTOTOTAL_KEYSTORE_BASE64, ACERTOTOTAL_KEYSTORE_PASSWORD e ACERTOTOTAL_KEY_ALIAS
  # (a senha da chave é a mesma da keystore). Se faltar algum, para com erro: nunca assina com a chave de teste.
  release:
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && contains(github.event.head_commit.message, '[release]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Preparar chave de envio
        env:
          KEYSTORE_BASE64: ${{ secrets.ACERTOTOTAL_KEYSTORE_BASE64 }}
          SENHA: ${{ secrets.ACERTOTOTAL_KEYSTORE_PASSWORD }}
          ALIAS: ${{ secrets.ACERTOTOTAL_KEY_ALIAS }}
        run: |
          for v in KEYSTORE_BASE64 SENHA ALIAS; do
            if [ -z "${!v}" ]; then
              echo "::error::Falta um Secret da chave de envio (ACERTOTOTAL_KEYSTORE_BASE64, ACERTOTOTAL_KEYSTORE_PASSWORD ou ACERTOTOTAL_KEY_ALIAS)."
              exit 1
            fi
          done
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/envio.keystore"
          printf 'arquivo=%s\nalias=%s\nsenha=%s\n' "$RUNNER_TEMP/envio.keystore" "$ALIAS" "$SENHA" > android/assinatura-play.properties
      - name: Compilar o AAB assinado
        run: |
          cd android
          ./gradlew --no-daemon bundleProducaoRelease
          cp app/build/outputs/bundle/producaoRelease/app-producao-release.aab ../acertototal.aab
      # O pacote vai como artefato do workflow (guardado por 14 dias), e não como Release pública. O repositório é
      # público: um APK de produção solto deixaria o teste grátis ser reiniciado sem fim, limpando os dados do app.
      - name: Guardar o AAB para enviar ao Play Console
        uses: actions/upload-artifact@v4
        with:
          name: acertototal-aab
          path: acertototal.aab
          retention-days: 14
